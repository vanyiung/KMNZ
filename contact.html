<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>联系表单 — KMNZ</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
  (function(){
    try{
      var t = localStorage.getItem('kmnzTheme');
      if(!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t='dark';
      document.documentElement.setAttribute('data-theme', t || 'light');
      var dark = (t === 'dark');
      var vars = {
        '--bg': dark? '#0b1116' : '#ffffff',
        '--surface': dark? '#0f1720' : '#ffffff',
        '--text': dark? '#e6eef8' : '#222222',
        '--muted': dark? '#9aa6b2' : '#666',
        '--border': dark? 'rgba(255,255,255,0.06)' : '#eee',
        '--accent': dark? '#59a6ff' : '#1e88e5',
        '--hero-overlay': dark? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.36)',
        '--hero-foreground': '#ffffff'
      };
      for(var k in vars) document.documentElement.style.setProperty(k, vars[k]);
    }catch(e){}
  })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">KMNZ</h1>
      <button id="nav-toggle" class="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="打开导航">☰</button>
      <nav id="site-nav" class="site-nav" role="navigation" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="members.html">成员</a>
        <a href="history.html">历程</a>
        <a href="about.html">关于</a>
        <button id="nav-auth-btn" class="nav-auth-btn" aria-haspopup="dialog">登录 / 注册</button>
        <div id="nav-user" class="nav-user" hidden>
          <img id="nav-user-avatar" src="assets/images/default4.png" alt="用户头像">
          <span id="nav-user-id"></span>
          <button id="nav-signout" class="nav-signout" aria-label="退出登录">退出</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:24px 0">
    <h2>联系表单</h2>
    <p class="help">为保障数据真实性，仅登录/注册后方可提交。</p>
    <form id="contact-form" class="card" style="padding:16px;max-width:640px">
      <div class="field">
        <label for="name">昵称</label>
        <input type="text" id="name" placeholder="你的昵称" required aria-required="true">
      </div>
      <div class="field">
        <label for="email">邮箱 / 用户名</label>
        <input type="email" id="email" placeholder="you@example.com" required aria-required="true">
      </div>
      <div class="field">
        <label for="message">留言</label>
        <textarea id="message" rows="5" placeholder="想说的话…" required aria-required="true"></textarea>
      </div>
      <div style="margin-top:12px">
        <button type="submit" id="contact-submit">提交</button>
        <a href="auth.html#login" id="contact-login-link" style="margin-left:8px">前往登录/注册</a>
      </div>
      <div id="form-status" class="help" style="margin-top:8px"></div>
    </form>
  </main>

  <footer class="site-footer"><div class="container">© 2025 KMNHZ-China</div></footer>

  <script src="js/main.js"></script>
  <script>
    // 进入页面后，若已登录则自动填充 name/email 并允许提交
    (function(){
      const user = window.getStoredUser && window.getStoredUser();
      const nameEl = document.getElementById('name');
      const emailEl = document.getElementById('email');
      const status = document.getElementById('form-status');
      const submitBtn = document.getElementById('contact-submit');
      const loginLink = document.getElementById('contact-login-link');
      if(user){
        if(nameEl) nameEl.value = user.name || user.id || '';
        if(emailEl){ emailEl.value = user.id || ''; emailEl.readOnly = true; }
        if(status) status.textContent = '已登录，可提交。';
        if(loginLink) loginLink.style.display = 'none';
      } else {
        if(status) { status.textContent = '未登录，提交已禁用。请先登录或注册。'; status.style.color = 'crimson'; }
        if(submitBtn) submitBtn.disabled = true;
      }
    })();
  </script>
</body>
</html>
