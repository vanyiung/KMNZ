<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人中心 — KMNZ</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png">
  <meta name="theme-color" content="#ffffff">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">KMNZ</h1>
      <button id="nav-toggle" class="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="打开导航">☰</button>
      <nav id="site-nav" class="site-nav" role="navigation" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="members.html">成员</a>
        <a href="history.html">历程</a>
        <a href="about.html">关于</a>
        <button id="nav-auth-btn" class="nav-auth-btn" aria-haspopup="dialog">登录 / 注册</button>
        <div id="nav-user" class="nav-user" hidden>
          <img id="nav-user-avatar" src="assets/images/default4.png" alt="用户头像">
          <span id="nav-user-id"></span>
          <button id="nav-signout" class="nav-signout" aria-label="退出登录">退出</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page-section">
      <div class="profile-header">
        <div class="profile-avatar">
          <img id="user-avatar" src="assets/images/default4.png" alt="当前头像">
        </div>
        <div>
          <div><strong id="user-name">用户</strong></div>
          <div id="user-id" class="profile-id">ID: -</div>
        </div>
      </div>

      <hr class="profile-divider">

      <form id="avatar-form">
        <div class="field">
          <label for="user-avatar-file">上传头像：</label>
          <input id="user-avatar-file" type="file" accept="image/*">
        </div>
        <div class="field">
          <label for="user-avatar-url">或使用图片 URL：</label>
          <input id="user-avatar-url" type="url" placeholder="https://...">
        </div>
        <div class="profile-actions">
          <button type="button" id="btn-avatar-save">保存头像</button>
          <button type="button" id="btn-avatar-clear">清除为默认</button>
          <button type="button" id="btn-back">返回首页</button>
        </div>
        <div id="avatar-msg" class="status-line form-note"></div>
        <div id="default-avatars" class="default-avatars" aria-label="默认头像列表" role="list"></div>
      </form>

    </section>
  </main>

  <footer class="site-footer"><div class="container">© 2025 KMNHZ-China</div></footer>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
