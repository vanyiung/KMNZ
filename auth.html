<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 / 注册 — KMNZ</title>
  <script>
  (function(){
    try{
      var t = localStorage.getItem('kmnzTheme');
      if(!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t='dark';
      document.documentElement.setAttribute('data-theme', t || 'light');
      var dark = (t === 'dark');
      var vars = {
        '--bg': dark? '#0b1116' : '#ffffff',
        '--surface': dark? '#0f1720' : '#ffffff',
        '--text': dark? '#e6eef8' : '#222222',
        '--muted': dark? '#9aa6b2' : '#666',
        '--border': dark? 'rgba(255,255,255,0.06)' : '#eee',
        '--accent': dark? '#59a6ff' : '#1e88e5',
        '--hero-overlay': dark? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.36)',
        '--hero-foreground': '#ffffff'
      };
      for(var k in vars) document.documentElement.style.setProperty(k, vars[k]);
    }catch(e){}
  })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="KMNZ 登录与注册"> 
  <meta name="robots" content="noindex">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">KMNZ</h1>
      <button id="nav-toggle" class="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="打开导航">☰</button>
      <nav id="site-nav" class="site-nav" role="navigation" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="members.html">成员</a>
        <a href="history.html">历程</a>
        <a href="about.html">关于</a>
        <button id="nav-auth-btn" class="nav-auth-btn" aria-haspopup="dialog">登录 / 注册</button>
        <div id="nav-user" class="nav-user" hidden>
          <img id="nav-user-avatar" src="assets/images/default4.png" alt="用户头像">
          <span id="nav-user-id"></span>
          <button id="nav-signout" class="nav-signout" aria-label="退出登录">退出</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-left">
      <img src="assets/images/kmnz2.png" alt="KMNZ" />
    </div>
    <div class="auth-right" id="auth-right">
      <div class="auth-inner">
        <div class="auth-tabs" role="tablist" aria-label="认证切换">
          <button id="tab-login" class="tab-btn" role="tab" aria-controls="panel-login" aria-selected="true">登录</button>
          <button id="tab-register" class="tab-btn" role="tab" aria-controls="panel-register" aria-selected="false">注册</button>
        </div>

        <div class="auth-panel" id="panel-login" role="tabpanel">
          <h2>登录</h2>
          <form id="login-form" novalidate>
            <div class="field">
              <label for="login-email">邮箱</label>
              <input type="email" id="login-email" required aria-required="true" placeholder="you@example.com">
            </div>
            <div class="field">
              <label for="login-password">密码</label>
              <input type="password" id="login-password" required aria-required="true">
            </div>
            <div style="margin-top:12px"><button type="submit">登录</button></div>
            <div id="login-status" aria-live="polite" class="help" style="margin-top:8px"></div>
            <div style="margin-top:8px"><a class="auth-forgot" href="reset.html">忘记密码？</a></div>
          </form>
        </div>

        <div class="auth-panel" id="panel-register" role="tabpanel" hidden>
          <h2>注册</h2>
          <form id="register-form" novalidate>
            <div class="field">
              <label for="reg-name">昵称</label>
              <input type="text" id="reg-name" required aria-required="true" placeholder="你的昵称">
            </div>
            <div class="field">
              <label for="reg-email">邮箱</label>
              <input type="email" id="reg-email" required aria-required="true" placeholder="you@example.com">
            </div>
            <div class="field">
              <label for="reg-password">密码</label>
              <input type="password" id="reg-password" required aria-required="true" aria-describedby="pwd-meta">
              <div class="password-strength" aria-hidden="true"><i id="pwd-bar"></i></div>
              <div id="pwd-meta" class="password-meta">建议至少 8 位，包含字母和数字。</div>
            </div>
            <div class="field">
              <label for="reg-password2">确认密码</label>
              <input type="password" id="reg-password2" required aria-required="true" aria-describedby="match-meta">
              <div id="match-meta" class="help" aria-live="polite"></div>
            </div>

            <!-- 头像选择已移除，注册后请在个人页面编辑头像 -->

            <div style="margin-top:12px"><button type="submit">注册</button></div>
            <div id="reg-status" aria-live="polite" class="help" style="margin-top:8px"></div>
            <div id="reg-success" class="success-note" hidden>注册成功，你已登录。</div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="container">© 2025 KMNHZ-China</div></footer>

  <!-- 引入站点脚本，确保认证交互可用 -->
  <script src="js/main.js"></script>
</body>
</html>
